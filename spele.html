<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Peg Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3b4d9;--fr:#a94e9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#d1a9cc;--fr:#3a4c96}}
:root[data-theme="dark"]{--bg:#a73f81;--fr:#3a4c96}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:Fredoka,system-ui,Courier New}
canvas{width:min(100vw,calc((100vh - 8px)*4/3));aspect-ratio:4/3;border:3px solid var(--fr);border-radius:14px;touch-action:none;cursor:crosshair;max-width:100%}
</style></head><body><canvas id="c" width="800" height="600"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=800,H=600,G=800,BR=7,PR=10,E=.68,SPD=650,CX=400,CY=30,SL=[10000,25000,50000,25000,10000];
const SC=[262,294,330,349,392,440,494,523,587,659,698,784];
const MAS=[['Moss','guide','Super Guide'],['Zig','multi','Multi-Ball'],['Dusk','spooky','Spooky Ball'],['Ember','fire','Fireball'],['Hush','zen','Zen Ball']];
const FONT=s=>'700 '+s+'px Fredoka,system-ui,sans-serif';
let ac;const tone=(f,d=.15,t='sine',v=.12,w=0)=>{try{ac=ac||new AudioContext();ac.resume();const T=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d)}catch(e){}};
const fan=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.11));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAT=[
()=>{const a=[];for(let r=0;r<8;r++)for(let c=0;c<13;c++)a.push([62+c*55+(r%2)*27,150+r*52]);return a},
()=>{const a=[];for(let r=1;r<=5;r++){const n=r*7;for(let i=0;i<n;i++){const t=i/n*6.283;a.push([400+Math.cos(t)*r*52,330+Math.sin(t)*r*40])}}return a},
()=>{const a=[];for(let i=0;i<95;i++){const t=i*.33,r=18+i*2.8;a.push([400+Math.cos(t)*r*1.25,330+Math.sin(t)*r*.85])}return a},
()=>{const a=[];for(let r=0;r<6;r++)for(let c=0;c<16;c++)a.push([50+c*47,170+r*62+Math.sin(c*.7+r)*26]);return a},
()=>{const a=[];for(let k=0;k<5;k++)for(let i=0;i<14;i++){const t=.2+i*.2,R=110+k*65;a.push([400+Math.cos(t)*R,100+Math.sin(t)*R])}return a},
()=>{const a=[];for(let r=1;r<=6;r++){const n=r*6;for(let i=0;i<n;i++){const t=i/n*6.283,m=Math.abs(Math.cos(t))+Math.abs(Math.sin(t));a.push([400+Math.cos(t)/m*r*58,330+Math.sin(t)/m*r*44])}}return a},
()=>{const a=[];for(let r=0;r<9;r++)for(let c=0;c<14;c++)a.push([55+c*52+(r%2)*26,140+r*44]);return a},
()=>{const a=[];for(const[cx,cy,R]of[[200,300,70],[600,300,70],[400,430,80],[400,230,50]])for(let k=1;k<=2;k++){const n=8+k*6;for(let i=0;i<n;i++){const t=i/n*6.283;a.push([cx+Math.cos(t)*R*k/2*1.4,cy+Math.sin(t)*R*k/2*1.4])}}return a},
()=>{const a=[];for(let r=0;r<7;r++)for(let c=0;c<14;c++){const m=c%4;a.push([60+c*52,160+r*52+(m<2?m:4-m)*16])}return a},
()=>{const a=[];for(let i=0;i<24;i++)for(const d of[0,40]){const u=i/23;a.push([60+u*680,140+u*370+d*.4]);a.push([740-u*680,140+u*370+d*.4])}return a}];
function mkLevel(i){
 const R=rng(i*7919+13);let pts=PAT[i]().filter(p=>p[0]>40&&p[0]<760&&p[1]>130&&p[1]<520),out=[];
 for(const p of pts)if(out.length<105&&out.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>24))out.push(p);
 const idx=out.map((_,k)=>k).sort(()=>R()-.5);
 return out.map((p,k)=>{const a=R()*3.14,br=k%6==2;return{x:p[0],y:p[1],t:idx.indexOf(k)<25?'o':idx.indexOf(k)<27?'g':'b',l:br?34:0,ux:Math.cos(a),uy:Math.sin(a),lit:0,dead:0,pu:0}})}
let S='title',lv=0,pegs=[],bl=[],nb=10,score=0,hi=0,left=25,combo=0,ch=0,fev=0,ts=1,fevEnd=0,bx=400,bv=100,acc=0,rt=0,shotPts=0,nextExtra=60000,mx=400,my=300,T=0;
let parts=[],pops=[];
const burst=(px,py,n,c)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:.6+Math.random()*.4,c})}};
const pop=(px,py,s,c)=>pops.push({x:px,y:py,s:''+s,c,t:1.2});
const pcol=p=>p.pu?'#c04dff':{o:'#ff8a1f',b:'#3d8bff',g:'#3ddc6b'}[p.t];
function startLevel(i){lv=i;pegs=mkLevel(i);bl=[];nb=10;left=25;score=0;ch=0;fev=0;ts=1;fevEnd=0;nextExtra=60000;bx=400;parts=[];pops=[];nextAim()}
function nextAim(){S='aim';combo=0;shotPts=0;pegs.forEach(p=>p.pu=0);const os=pegs.filter(p=>p.t=='o'&&!p.dead);if(os.length)os[Math.random()*os.length|0].pu=1}
const ang=()=>Math.max(-1.396,Math.min(1.396,Math.atan2(mx-CX,Math.max(1,my-CY))));
function fire(){
 if(S!='aim')return;nb--;const a=ang(),m=MAS[lv%5][1],use=ch>0;let list=[a];
 if(use){ch--;if(m=='multi')list=[a-.14,a,a+.14]}
 for(const q of list)bl.push({x:CX+Math.sin(q)*34,y:CY+Math.cos(q)*34,vx:Math.sin(q)*SPD,vy:Math.cos(q)*SPD,sp:use&&m=='spooky',fire:use&&m=='fire',zen:use&&m=='zen',slow:0});
 S='play';tone(180,.2,'square',.1)}
function stepBall(b,dt,hit){
 b.vy+=G*dt;
 if(b.zen){let best=null,bd=170;for(const p of pegs)if(!p.lit&&!p.dead&&p.y>b.y-10){const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p}}if(best){b.vx+=(best.x-b.x)/bd*260*dt;b.vy+=(best.y-b.y)/bd*260*dt}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 if(b.x<BR){b.x=BR;b.vx=Math.abs(b.vx)*E}
 if(b.x>W-BR){b.x=W-BR;b.vx=-Math.abs(b.vx)*E}
 if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy)*E}
 for(const p of pegs){if(p.dead)continue;let cx=p.x,cy=p.y;
  if(p.l){let t=(b.x-p.x)*p.ux+(b.y-p.y)*p.uy;t=Math.max(-p.l/2,Math.min(p.l/2,t));cx=p.x+p.ux*t;cy=p.y+p.uy*t}
  let dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);const r=BR+PR;
  if(d<r){if(d<1e-6){dx=0;dy=-1;d=1}const nx=dx/d,ny=dy/d;b.x=cx+nx*r;b.y=cy+ny*r;const vn=b.vx*nx+b.vy*ny;
   if(vn<0){b.vx-=(1+E)*vn*nx;b.vy-=(1+E)*vn*ny;const j=(Math.random()-.5)*.017,c=Math.cos(j),s=Math.sin(j),vx=b.vx;b.vx=vx*c-b.vy*s;b.vy=vx*s+b.vy*c}
   hit(p,b)}}}
function hit(p,b){
 if(p.lit)return;p.lit=1;
 const base=p.pu?500:p.t=='o'?100:10,m=left>15?1:left>10?2:left>6?3:left>3?5:10,pts=base*m;
 score+=pts;shotPts+=pts;pop(p.x,p.y-14,pts,'#fff');tone(SC[Math.min(combo++,11)],.18);burst(p.x,p.y,6,pcol(p));
 if(score>=nextExtra){nextExtra+=60000;nb++;pop(400,300,'FREE BALL','#7dff9c');fan()}
 if(p.t=='g'){ch=2;pop(p.x,p.y-34,MAS[lv%5][2]+'!','#7dff9c');tone(880,.3,'triangle')}
 if(p.t=='o'&&--left==0){fev=1;ts=.3;bl.forEach(q=>{if(q!==b)q.dead=1});pop(400,250,'EXTREME FEVER!','#ffd23f');fan()}
 if(b.fire&&!b.burning){b.burning=1;for(const q of pegs)if(!q.lit&&!q.dead&&Math.hypot(q.x-p.x,q.y-p.y)<60)hit(q,b);b.burning=0}}
function unstick(b){
 for(const p of pegs)if(!p.dead&&Math.hypot(b.x-p.x,b.y-p.y)<p.l/2+PR+BR+3){hit(p,b);p.dead=1;burst(p.x,p.y,10,pcol(p))}
 b.vx+=(Math.random()-.5)*80;b.vy+=30}
function phys(h){
 if(!fev){bx+=bv*h;if(bx<50||bx>750){bv=-bv;bx=Math.max(50,Math.min(750,bx))}}
 for(const b of bl){if(b.dead)continue;
  stepBall(b,h,hit);b.slow=Math.hypot(b.vx,b.vy)<35?b.slow+h:0;if(b.slow>1){b.slow=0;unstick(b)}
  if(fev){if(b.y>H-34){const s=Math.min(4,b.x/160|0);score+=SL[s];pop(b.x,H-70,'+'+SL[s],'#ffd23f');fan();b.dead=1;fevEnd=1.6;burst(b.x,H-40,50,'#ffd23f')}continue}
  if(b.vy>0&&b.y>H-26&&Math.abs(b.x-bx)<40){b.dead=1;nb++;pop(bx,H-60,'FREE BALL','#7dff9c');fan();continue}
  if(b.y>H+BR){if(b.sp){b.sp=0;b.y=-BR}else b.dead=1}}
 bl=bl.filter(b=>!b.dead)}
function upd(dt){
 T+=dt;
 if(S=='play'){acc+=dt*ts;while(acc>=1/120){acc-=1/120;phys(1/120)}
  if(fevEnd>0){fevEnd-=dt;if(fevEnd<=0){S='win';hi=Math.max(hi,score);ts=1}}
  else if(!fev&&!bl.length){S='res';rt=.5}}
 else if(S=='res'){rt-=dt;if(rt<=0){for(const p of pegs)if(p.lit&&!p.dead){p.dead=1;burst(p.x,p.y,12,pcol(p))}
  hi=Math.max(hi,score);if(nb<=0)S='over';else nextAim()}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const p of pops){p.y-=30*dt;p.t-=dt}pops=pops.filter(p=>p.t>0)}
function drawPeg(p){
 const c=pcol(p);x.save();if(p.lit){x.shadowColor=c;x.shadowBlur=20}
 x.lineCap='round';const hx=p.l?p.ux*p.l/2:0,hy=p.l?p.uy*p.l/2:0;
 const path=(ox,oy)=>{x.beginPath();x.moveTo(p.x-hx+ox,p.y-hy+oy);x.lineTo(p.x+hx+ox+.01,p.y+hy+oy);x.stroke()};
 x.lineWidth=PR*2;x.strokeStyle=c;path(0,0);
 if(p.lit){x.strokeStyle='rgba(255,255,255,.6)';path(0,0)}
 x.shadowBlur=0;x.lineWidth=4;x.strokeStyle='rgba(255,255,255,.45)';path(-3,-3);x.restore();
 if(left==1&&p.t=='o'&&!p.lit){x.strokeStyle='#ffd23f';x.lineWidth=3;x.beginPath();x.arc(p.x,p.y,PR+6+Math.sin(T*8)*2,0,6.3);x.stroke()}}
function txt(s,px,py,sz,c,al='center'){x.font=FONT(sz);x.textAlign=al;x.fillStyle=c;x.fillText(s,px,py)}
function draw(){
 const h=lv*36+210,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${h},55%,24%)`);g.addColorStop(1,`hsl(${h+40},60%,9%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
 if(S=='title'){txt('PEG BLOOM',400,190,84,'#ffd23f');txt('Aim, fire, clear every orange peg.',400,240,22,'#cfe0ff');
  for(let i=0;i<10;i++){const px=140+(i%5)*110,py=310+(i/5|0)*90;x.fillStyle=`hsl(${i*36+210},55%,40%)`;x.beginPath();x.roundRect(px,py,80,70,14);x.fill();txt(i+1,px+40,py+46,32,'#fff')}
  txt('Pick a level',400,295,18,'#cfe0ff');return}
 for(const p of pegs)if(!p.dead)drawPeg(p);
 // cannon
 const a=ang();x.save();x.translate(CX,CY);x.rotate(-a);x.fillStyle='#d9e2ff';x.beginPath();x.roundRect(-8,0,16,36,5);x.fill();x.restore();
 x.fillStyle='#8aa0ff';x.beginPath();x.arc(CX,CY,16,0,6.3);x.fill();
 if(S=='aim'){const m=MAS[lv%5][1],n=ch>0&&m=='guide'?3:1;let b={x:CX+Math.sin(a)*34,y:CY+Math.cos(a)*34,vx:Math.sin(a)*SPD,vy:Math.cos(a)*SPD},k=0;
  x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<700&&k<n&&b.y<H;i++){stepBall(b,1/120,()=>{k++});if(i%6==0){x.beginPath();x.arc(b.x,b.y,2,0,6.3);x.fill()}}}
 if(!fev){x.fillStyle='#ffd23f';x.beginPath();x.moveTo(bx-45,H-26);x.lineTo(bx-34,H-4);x.lineTo(bx+34,H-4);x.lineTo(bx+45,H-26);x.lineTo(bx+36,H-26);x.lineTo(bx+28,H-12);x.lineTo(bx-28,H-12);x.lineTo(bx-36,H-26);x.fill()}
 else for(let i=0;i<5;i++){x.fillStyle=`hsl(${i*70},80%,50%)`;x.globalAlpha=.85;x.fillRect(i*160+3,H-34,154,34);x.globalAlpha=1;txt(SL[i]/1000+'k',i*160+80,H-10,20,'#fff')}
 for(const b of bl){x.fillStyle=b.fire?'#ff6b2c':b.zen?'#7dffea':b.sp?'#d7b6ff':'#f2f5ff';x.shadowColor=x.fillStyle;x.shadowBlur=b.fire||b.zen||b.sp?14:0;x.beginPath();x.arc(b.x,b.y,BR,0,6.3);x.fill();x.shadowBlur=0}
 for(const p of parts){x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;
 for(const p of pops){x.globalAlpha=Math.min(1,p.t);txt(p.s,p.x,p.y,p.s.length>7?30:18,p.c);x.globalAlpha=1}
 // HUD
 for(let i=0;i<nb;i++){x.fillStyle='#f2f5ff';x.beginPath();x.arc(16,80+i*16,5,0,6.3);x.fill()}
 txt(MAS[lv%5][0]+(ch>0?' · '+MAS[lv%5][2]+' x'+ch:''),12,24,18,'#cfe0ff','left');txt('Orange left '+left,12,46,16,'#ff8a1f','left');
 txt('Score '+score,788,24,20,'#fff','right');txt('Shot '+shotPts+'  Best '+hi,788,46,15,'#cfe0ff','right');
 if(S=='win'||S=='over'){x.fillStyle='rgba(5,10,30,.72)';x.fillRect(0,0,W,H);
  txt(S=='win'?'Level complete':'Out of balls',400,230,60,S=='win'?'#ffd23f':'#ff8a8a');txt('Score '+score+(S=='win'?'   Balls left '+nb:''),400,285,26,'#fff');
  txt(S=='win'?(lv<9?'Tap for next level':'All levels cleared. Tap for menu'):'Tap to retry',400,340,22,'#cfe0ff')}}
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',pos);
cv.addEventListener('pointerdown',e=>{pos(e);ac=ac||new AudioContext();ac.resume();
 if(S=='title'){for(let i=0;i<10;i++){const px=140+(i%5)*110,py=310+(i/5|0)*90;if(mx>px&&mx<px+80&&my>py&&my<py+70)startLevel(i)}}
 else if(S=='aim')fire();else if(S=='win'){lv<9?startLevel(lv+1):S='title'}else if(S=='over')startLevel(lv)});
let last=0;(function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)})(0);
</script></body></html>
